[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["E501"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Body",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[project]
name = "Workout-Journal"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "TihonERA", email = "miha311008@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
  "aio-pika",
  "alembic>=1.20.0",
  "asyncio>=4.0.0",
  "asyncpg",
  "fastapi>=0.143.5",
  "greenlet>=3.5.6",
  "httpx>=0.28.1",
  "locust>=2.47.0",
  "psycopg>=3.3.6",
  "pydantic>=2.14.1",
  "pydantic-settings>=2.16.0",
  "redis>=8.1.0",
  "ruff>=0.17.1",
  "sqlalchemy>=2.1.5",
  "user-agents>=2.2.0",
  "uvicorn>=0.54.0",
]

[project.scripts]
Workout-Journal = "src.main:main"

[tool.pyright]
include = ["src", "alembic"]
executionEnvironments = [{ root = "." }]
